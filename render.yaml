# Render Blueprint — InstaPay Detector Payment Gateway Monorepo
# https://render.com/docs/blueprint-spec
#
# This file defines the infrastructure for the InstaPay Detector gateway.
# The DATABASE is EXTERNAL (Supabase, Neon, Railway, or any managed Postgres).
# Set the DATABASE_URL env var to your external database connection string.

services:
  # --- Main Next.js gateway ---
  - type: web
    name: instapay-gateway
    runtime: node
    plan: starter     # $7/month — required (free tier spins down after 15min)
    rootDir: instapay_payment_getway
    buildCommand: |
      cp prisma/schema.production.prisma prisma/schema.prisma &&
      npm install &&
      npx prisma generate &&
      npm run build
    startCommand: npx prisma db push --accept-data-loss && npm run start
    envVars:
      # External PostgreSQL database (Supabase, Neon, Railway, etc.)
      - key: DATABASE_URL
        sync: false  # set manually in Render dashboard (use Port 5432 or direct connection)
      - key: DIRECT_URL
        sync: false  # optional: set to Port 5432 if DATABASE_URL uses transaction pooler (Port 6543)
      # Shared secret between the Android app and the webhook.
      - key: DETECT_TOKEN
        sync: false  # set manually — must match notifier & Android app
      - key: MERCHANT_HANDLE
        value: mohammedshabana77@instapay
      - key: MERCHANT_NAME
        value: Mohammed Shabana
      - key: CHECKOUT_TTL_MIN
        value: "10"
      # The notifier service URL
      - key: NOTIFIER_URL
        sync: false  # set manually after deploy: https://instapay-notifier-xxxx.onrender.com
      - key: NEXT_PUBLIC_NOTIFIER_URL
        sync: false  # same as NOTIFIER_URL
    healthCheckPath: /
    autoDeploy: true

  # --- WebSocket notifier mini-service ---
  - type: web
    name: instapay-notifier
    runtime: node
    plan: starter     # $7/month — required (always-on for WebSocket connections)
    rootDir: instapay_payment_getway/mini-services/checkout-notifier
    buildCommand: npm install
    startCommand: npx tsx index.ts
    envVars:
      - key: CORS_ORIGIN
        sync: false  # set manually after deploy: https://instapay-gateway-xxxx.onrender.com
      - key: DETECT_TOKEN
        sync: false  # set manually — must match gateway's DETECT_TOKEN
    healthCheckPath: /health
    autoDeploy: true
